'use strict';
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = 1280, H = 720;
const PIXEL_SCALE = 2;
const params = new URLSearchParams(location.search);
const STEP = 1 / 60;

function fit() {
  const k = Math.min(innerWidth / W, innerHeight / H);
  const r = k * (devicePixelRatio || 1);
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  canvas.style.width = Math.round(W * k) + 'px';
  canvas.style.height = Math.round(H * k) + 'px';
  canvas.style.marginTop = Math.max(0, Math.floor((innerHeight - H * k) / 2)) + 'px';
  ctx.setTransform(r, 0, 0, r, 0, 0);
}
addEventListener('resize', fit); fit();

// ---- Typography -----------------------------------------------------------------------------
const ROLES = {
  display: '600 {s}px "Sitka Display", Georgia, serif',
  story:   '500 {s}px "Sitka Text", Georgia, serif',
  thought: 'italic 400 {s}px "Sitka Text", Georgia, serif',
  ui:      '600 {s}px "Candara", "Segoe UI", sans-serif',
  label:   '700 {s}px "Candara", "Segoe UI", sans-serif',
  mono:    '600 {s}px "Cascadia Mono", Consolas, monospace',
};
function fnt(size, role = 'ui') { return (ROLES[role] || ROLES.ui).replace('{s}', Math.round(size)); }
function measureW(s, size, role = 'ui') {
  ctx.save(); ctx.font = fnt(size, role);
  const w = ctx.measureText(String(s)).width; ctx.restore(); return w;
}
function txt(s, x, y, size, col, align = 'center', role = 'ui') {
  ctx.save(); ctx.font = fnt(size, role); ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(6,8,14,0.88)'; ctx.shadowBlur = 4; ctx.shadowOffsetY = 1.5;
  ctx.fillStyle = col; ctx.fillText(String(s), Math.round(x), Math.round(y)); ctx.restore();
}
function wrap(s, maxW, size, role = 'story') {
  const words = String(s).split(' '), out = []; let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (measureW(t, size, role) > maxW && cur) { out.push(cur); cur = w; } else cur = t;
  }
  if (cur) out.push(cur);
  return out;
}

// ---- Assets loader --------------------------------------------------------------------------
const ASSETS = window.HOLLOW_ASSETS || {};
const SPRITES = {};
const READY_PROMISES = Object.entries(ASSETS).map(([k, v]) => {
  const img = new Image(); SPRITES[k] = img;
  return new Promise(res => {
    img.onload = () => { if (params.get('manual') === '1') drawFrame(); res(); };
    img.onerror = res; img.src = v.src;
  });
});

function animFrame(key, tag, t) {
  const meta = ASSETS[key]; if (!meta || !meta.frames.length) return null;
  const tg = tag && meta.tags ? meta.tags[tag] : null;
  const from = tg ? tg.from : 0, to = tg ? tg.to : meta.frames.length - 1;
  if (from === to) return meta.frames[from];
  let total = 0; for (let i = from; i <= to; i++) total += meta.frames[i].dur || 200;
  let ms = (Math.max(0, t || 0) * 1000) % total;
  for (let i = from; i <= to; i++) { const d = meta.frames[i].dur || 200; if (ms < d) return meta.frames[i]; ms -= d; }
  return meta.frames[from];
}
function drawSprite(key, tag, x, y, opts = {}) {
  const img = SPRITES[key], meta = ASSETS[key];
  if (!img || !meta || !img.complete || !img.naturalWidth) return false;
  const fr = animFrame(key, tag, opts.t); if (!fr) return false;
  const scale = (opts.scale !== undefined ? opts.scale : 1) * PIXEL_SCALE;
  const facing = opts.facing !== undefined ? opts.facing : 1;
  const ax = opts.ax !== undefined ? opts.ax : meta.ax;
  const ay = opts.ay !== undefined ? opts.ay : meta.ay;
  ctx.save(); ctx.imageSmoothingEnabled = false;
  if (opts.alpha !== undefined) ctx.globalAlpha *= opts.alpha;
  ctx.translate(Math.round(x), Math.round(y));
  ctx.scale(facing * scale, scale);
  ctx.drawImage(img, fr.x, fr.y, fr.w, fr.h, -ax, -ay, fr.w, fr.h);
  ctx.restore();
  return true;
}
function drawParallax(key, scrollX) {
  const img = SPRITES[key]; if (!img || !img.complete || !img.naturalWidth) return;
  const tw = img.naturalWidth * PIXEL_SCALE, th = img.naturalHeight * PIXEL_SCALE;
  const start = -(((Math.round(scrollX) % tw) + tw) % tw);
  ctx.save(); ctx.imageSmoothingEnabled = false;
  for (let x = start; x < W; x += tw) ctx.drawImage(img, 0, 0, img.naturalWidth, img.naturalHeight, x, 0, tw, th);
  ctx.restore();
}

const down = new Set(), hit = new Set();
const pressed = c => hit.has(c);
addEventListener('keydown', e => {
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (['Space', 'Tab', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('blur', () => down.clear());
canvas.addEventListener('pointerdown', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  const my = (e.clientY - rect.top) * (H / rect.height);
  for (const b of state.buttons) {
    if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) { b.fn(); drawFrame(); return; }
  }
});

function setAct(id) {
  if (!ACTS[id]) return;
  state.act = id; state.x = 420; state.facing = 1; state.dlg = null;
  state.hooded = (id === 'act1' || id === 'act2');
  state.fx = { dust: [], dissolve: [], stepTick: 0 };
}
function interactTarget() {
  if (state.view !== 'world') return null;
  let best = null, bestD = 92;
  for (const en of ACTS[state.act].entities) {
    if (en.hidden && en.hidden(state)) continue;
    const d = Math.abs(state.x - en.x);
    if (d < bestD) { bestD = d; best = en; }
  }
  return best;
}

function stepOnce() {
  state.t += STEP;
  if (state.purifyBurstT > 0) state.purifyBurstT = Math.max(0, state.purifyBurstT - STEP);
  if (pressed('Tab')) {
    state.cutsceneMode = false;
    const order = ['world', 'chars', 'gallery', 'boss', 'bag', 'endings', 'legacy'];
    state.view = order[(order.indexOf(state.view) + 1) % order.length];
    state.dlg = null;
  }
  if (pressed('KeyB')) { state.cutsceneMode = false; state.view = state.view === 'boss' ? 'world' : 'boss'; state.dlg = null; }
  if (pressed('KeyJ')) { state.cutsceneMode = false; state.view = state.view === 'bag' ? 'world' : 'bag'; state.dlg = null; }
  if (pressed('KeyO')) { state.cutsceneMode = false; state.view = state.view === 'endings' ? 'world' : 'endings'; state.dlg = null; }
  if (pressed('KeyC')) { state.cutsceneMode = !state.cutsceneMode; state.dlg = null; }
  if (pressed('KeyI')) { state.cutsceneMode = false; state.view = state.view === 'gallery' ? 'world' : 'gallery'; state.dlg = null; }
  if (pressed('KeyL')) { state.cutsceneMode = false; state.view = state.view === 'legacy' ? 'world' : 'legacy'; state.dlg = null; }
  if (pressed('KeyT')) { location.href = 'topdown_maps.html'; }
  if (pressed('KeyU')) state.hooded = !state.hooded;
  if (pressed('KeyH')) state.hudHidden = !state.hudHidden;
  if (pressed('KeyM')) state.corrupt = !state.corrupt;
  if (pressed('KeyS')) { state.solo = !state.solo; if (state.view === 'gallery') state.hudAlt = state.solo; }
  if (pressed('Digit1')) { state.cutsceneMode = false; state.view = 'world'; setAct('act1'); }
  if (pressed('Digit2')) { state.cutsceneMode = false; state.view = 'world'; setAct('act2'); }
  if (pressed('Digit3')) { state.cutsceneMode = false; state.view = 'world'; setAct('act3'); }
  if (pressed('Digit4')) { state.cutsceneMode = false; state.view = 'world'; setAct('act4'); }

  if (state.cutsceneMode) {
    if (pressed('ArrowRight') || pressed('KeyD')) state.csIdx = (state.csIdx + 1) % CUTSCENES.length;
    if (pressed('ArrowLeft') || pressed('KeyA')) state.csIdx = (state.csIdx + CUTSCENES.length - 1) % CUTSCENES.length;
    if (pressed('Escape')) state.cutsceneMode = false;
    return;
  }

  if (state.view === 'chars') {
    if (pressed('ArrowRight') || pressed('KeyD')) { state.charIdx = (state.charIdx + 1) % CHAR_CARDS.length; state.charTagIdx = 0; state.portIdx = 0; }
    if (pressed('ArrowLeft') || pressed('KeyA')) { state.charIdx = (state.charIdx + CHAR_CARDS.length - 1) % CHAR_CARDS.length; state.charTagIdx = 0; state.portIdx = 0; }
    if (pressed('Space') || pressed('KeyE')) state.charTagIdx++;
    if (pressed('KeyP')) state.portIdx++;
    return;
  }
  if (state.view === 'bag') {
    if (pressed('ArrowRight') || pressed('KeyD')) state.itemIdx = (state.itemIdx + 1) % 7;
    if (pressed('ArrowLeft') || pressed('KeyA')) state.itemIdx = (state.itemIdx + 6) % 7;
    if (pressed('ArrowDown')) { state.beastIdx = (state.beastIdx + 1) % 4; state.wheelMsg = ''; }
    if (pressed('ArrowUp') || pressed('KeyW')) { state.beastIdx = (state.beastIdx + 3) % 4; state.wheelMsg = ''; }
    if (down.has('Space')) {
      state.holdT = Math.min(2.5, state.holdT + STEP);
      if (state.holdT >= 2.5) { state.holdT = 0; state.purifyBurstT = 0.85; state.purifyCount++; }
    } else if (state.holdT > 0) {
      state.holdT = Math.max(0, state.holdT - STEP * 2.5);
    }
    return;
  }
  if (state.view === 'endings') {
    return;
  }
  if (state.view === 'gallery' || state.view === 'legacy') {
    if (pressed('Space') || pressed('KeyE')) state.hudAlt = !state.hudAlt;
    return;
  }
  if (state.view === 'boss') {
    if (pressed('KeyP')) {
      const nxt = state.pillars.indexOf(false);
      if (nxt !== -1) state.pillars[nxt] = true;
      else { state.pillars = [false, false, false, false]; state.bossPurified = false; }
    }
    if (pressed('KeyF')) {
      if (!state.pillars.every(Boolean)) state.pillars = [true, true, true, true];
      state.bossPurified = !state.bossPurified;
    }
    if (down.has('Space')) {
      state.holdT = Math.min(2.5, state.holdT + STEP);
      if (state.holdT >= 2.5) { state.holdT = 0; state.purifyBurstT = 0.85; state.purifyCount++; }
    } else if (state.holdT > 0) {
      state.holdT = Math.max(0, state.holdT - STEP * 2.5);
    }
    return;
  }

  if (state.dlg) {
    if (pressed('Space') || pressed('Enter') || pressed('KeyE') || pressed('Escape')) state.dlg = null;
    return;
  }

  let v = 0;
  if (down.has('ArrowLeft') || down.has('KeyA')) v -= 260;
  if (down.has('ArrowRight') || down.has('KeyD')) v += 260;
  state.moving = v !== 0;
  if (v) {
    state.facing = v > 0 ? 1 : -1;
    state.x = Math.max(80, Math.min(ACTS[state.act].w - 80, state.x + v * STEP));
  }
  if (pressed('KeyE')) {
    const t = interactTarget();
    if (t) {
      if (t.key === 'cre_parasite_mite') state.miteRemoved = !state.miteRemoved;
      const text = typeof t.text === 'function' ? t.text(state) : t.text;
      const port = typeof t.port === 'function' ? t.port(state) : t.port;
      state.dlg = { name: t.name, text, port };
    }
  }
  stepWorldEffects();
}

function fxRand(seedVal) {
  const s = Math.sin(seedVal * 12.9898 + 78.233) * 43758.5453;
  return s - Math.floor(s);
}

function stepWorldEffects() {
  const fx = state.fx;
  fx.stepTick++;
  const gy = ACTS[state.act].gy;
  if (state.moving && fx.stepTick % 6 === 0) {
    const dustCol = state.act === 'act2' ? '#f4e4c4' : (state.act === 'act3' ? '#95adc4' : (state.act === 'act4' ? '#f5dba0' : '#cab896'));
    fx.dust.push({
      x: state.x - state.facing * (8 + fxRand(fx.stepTick) * 6),
      y: gy - 2,
      vx: -state.facing * (28 + fxRand(fx.stepTick + 1) * 20),
      vy: -(12 + fxRand(fx.stepTick + 2) * 14),
      life: 0.48, maxLife: 0.48, r: 4, col: dustCol,
    });
  }
  const isAct1Dissolve = state.act === 'act1' && (state.hooded || state.x < 1480);
  const isAct3SoloDissolve = state.act === 'act3' && state.solo;
  if ((isAct1Dissolve || isAct3SoloDissolve) && fx.stepTick % 4 === 0) {
    const side = fxRand(fx.stepTick * 1.3) < 0.5 ? -1 : 1;
    const isWarm = state.act === 'act1' && !state.corrupt;
    fx.dissolve.push({
      x: state.x + side * (8 + fxRand(fx.stepTick + 3) * 10),
      y: gy - 42 - fxRand(fx.stepTick + 4) * 16,
      vx: side * (6 + fxRand(fx.stepTick + 5) * 10),
      vy: -(18 + fxRand(fx.stepTick + 6) * 18),
      life: 0.95, maxLife: 0.95, sz: 2,
      col: isWarm ? (fxRand(fx.stepTick + 7) > 0.4 ? '#ffd984' : '#f4ecd8') : '#92f5ec',
    });
  }
  for (let i = fx.dust.length - 1; i >= 0; i--) {
    const p = fx.dust[i]; p.x += p.vx * STEP; p.y += p.vy * STEP; p.life -= STEP;
    if (p.life <= 0) fx.dust.splice(i, 1);
  }
  if (fx.dust.length > 64) fx.dust.splice(0, fx.dust.length - 64);
  for (let i = fx.dissolve.length - 1; i >= 0; i--) {
    const p = fx.dissolve[i];
    p.x += (p.vx + Math.sin(state.t * 4 + i) * 6) * STEP;
    p.y += p.vy * STEP; p.life -= STEP;
    if (p.life <= 0) fx.dissolve.splice(i, 1);
  }
  if (fx.dissolve.length > 48) fx.dissolve.splice(0, fx.dissolve.length - 48);
}

function drawPointLight(x, y, r, rgb, alpha) {
  if (x < -r || x > W + r || y < -r || y > H + r || alpha <= 0.005) return;
  const g = ctx.createRadialGradient(Math.round(x), Math.round(y), 2, Math.round(x), Math.round(y), r);
  g.addColorStop(0, `rgba(${rgb},${alpha})`);
  g.addColorStop(0.45, `rgba(${rgb},${alpha * 0.44})`);
  g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(Math.round(x), Math.round(y), r, 0, Math.PI * 2); ctx.fill();
}

// ---- Renderers ------------------------------------------------------------------------------
function drawWorld() {
  const act = ACTS[state.act];
  const cam = Math.max(0, Math.min(act.w - W, state.x - W / 2));

  drawParallax(act.bgs[0], cam * 0.06);
  const coreX = W / 2 - cam * 0.04;
  const pulseTag = state.corrupt ? 'strained' : 'warm';
  ctx.save();
  for (let i = 0; i < 6; i++) {
    const a = (i - 2.5) * 0.24 + Math.sin(state.t * 0.5 + i) * 0.03;
    const rg = ctx.createLinearGradient(coreX, act.coreY, coreX + Math.sin(a) * 540, act.gy);
    const col = state.corrupt ? '155,227,255' : '255,224,148';
    rg.addColorStop(0, `rgba(${col},0)`); rg.addColorStop(0.22, `rgba(${col},${state.corrupt ? 0.08 : 0.14})`); rg.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.moveTo(coreX - 18, act.coreY); ctx.lineTo(coreX + 18, act.coreY);
    ctx.lineTo(coreX + Math.sin(a) * 540 + 90, act.gy); ctx.lineTo(coreX + Math.sin(a) * 540 - 90, act.gy);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  drawSprite('prop_pulse_core', pulseTag, coreX, act.coreY, { scale: act.coreScale, t: state.t });

  drawParallax(act.bgs[1], cam * 0.38);

  // Drifting high-altitude cloud wisps in Act 2 behind the Leviathan deck
  if (state.act === 'act2') {
    ctx.save();
    for (let i = 0; i < 6; i++) {
      const cx = (((i * 290 + state.t * 14 - cam * 0.45) % (W + 320)) + (W + 320)) % (W + 320) - 160;
      const cy = 240 + (i % 3) * 74 + Math.sin(state.t * 0.4 + i) * 6;
      ctx.globalAlpha = state.corrupt ? 0.14 : 0.24;
      ctx.fillStyle = state.corrupt ? '#6e819c' : '#fff2cf';
      ctx.fillRect(Math.round(cx), Math.round(cy), 116, 18);
      ctx.fillRect(Math.round(cx + 18), Math.round(cy - 8), 72, 12);
    }
    ctx.restore();
  }

  drawParallax(act.bgs[2], cam);

  if (act.rain) {
    ctx.save();
    ctx.fillStyle = 'rgba(6, 9, 18, 0.16)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(182,196,220,0.44)';
    for (let i = 0; i < 32; i++) {
      const rx = ((i * 53 - state.t * 102) % W + W) % W;
      const ry = (i * 47 + state.t * 380) % act.gy;
      ctx.fillRect(rx, ry, 2, 12);
    }
    for (let i = 0; i < 6; i++) {
      const phase = (state.t * 1.4 + i * 0.19) % 1;
      const sx = ((i * 241 + 90 - cam * 0.85) % (W - 120) + W - 120) % (W - 120) + 60;
      ctx.strokeStyle = `rgba(180,218,242,${(1 - phase) * 0.35})`;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(Math.round(sx), act.gy + 8, 4 + phase * 14, 2 + phase * 5, 0, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  } else if (state.act === 'act1') {
    ctx.save();
    for (let i = 0; i < 16; i++) {
      const prog = (state.t * 0.14 + i * 0.31) % 1;
      const fx = (((i * 157 + state.t * 12 - cam * 0.45) % (W + 80)) + (W + 80)) % (W + 80) - 40;
      const fy = act.gy - prog * 360 + Math.sin(state.t + i) * 10;
      ctx.globalAlpha = Math.sin(prog * Math.PI) * 0.48;
      ctx.fillStyle = state.corrupt ? '#9eb2c7' : (i % 2 === 0 ? '#ffd480' : '#ffeab3');
      ctx.fillRect(Math.round(fx), Math.round(fy), 2, 2);
    }
    ctx.restore();
  } else if (state.act === 'act4') {
    ctx.save();
    for (let i = 0; i < 20; i++) {
      const fx = ((i * 89 + Math.sin(state.t + i) * 28) % W + W) % W;
      const fy = ((act.gy - 30 - i * 24 - state.t * 22) % act.gy + act.gy) % act.gy;
      ctx.fillStyle = state.corrupt ? 'rgba(155,227,255,0.5)' : 'rgba(255,214,107,0.55)';
      ctx.fillRect(fx, fy, 3, 3);
    }
    ctx.restore();
  }

  // Non-solid ambient flora decor (fx_ambient_flora) behind story entities
  for (const d of (act.decor || [])) {
    if (!ASSETS[d.key]) continue;
    const sx = d.x - cam; if (sx < -120 || sx > W + 120) continue;
    drawSprite(d.key, d.tag, sx, act.gy + 4, { scale: 1.05, t: state.t + d.x * 0.01 });
  }

  for (const en of act.entities) {
    if (en.front || (en.hidden && en.hidden(state))) continue;
    const sx = en.x - cam; if (sx < -220 || sx > W + 220) continue;
    const tag = typeof en.tag === 'function' ? en.tag(state) : en.tag;
    drawSprite(en.key, tag, sx, act.gy + (en.yOff || 0), { scale: 1.15, facing: en.x < state.x ? 1 : -1, t: state.t });
    if (en.key === 'prop_puddle') {
      const cnt = act.rain ? 3 : 2;
      for (let r = 0; r < cnt; r++) {
        const ph = (state.t * (act.rain ? 1.15 : 0.65) + r / cnt) % 1;
        ctx.save();
        ctx.strokeStyle = state.corrupt ? `rgba(155,227,255,${(1 - ph) * 0.32})` : `rgba(224,248,255,${(1 - ph) * 0.44})`;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.ellipse(Math.round(sx), act.gy + 2, 12 + ph * 34, 4 + ph * 10, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }
  }

  // Footstep dust & Pixel Dissolve behind/around Protag
  const px = state.x - cam;
  ctx.save();
  for (const p of state.fx.dust) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife) * 0.52;
    ctx.fillStyle = p.col;
    ctx.fillRect(Math.round(p.x - cam), Math.round(p.y), Math.round(p.r), Math.round(p.r));
  }
  for (const p of state.fx.dissolve) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife) * 0.85;
    ctx.fillStyle = p.col;
    ctx.fillRect(Math.round(p.x - cam), Math.round(p.y), p.sz, p.sz);
  }
  const isAct1Dissolve = state.act === 'act1' && (state.hooded || state.x < 1480);
  const isAct3SoloDissolve = state.act === 'act3' && state.solo;
  if (isAct1Dissolve || isAct3SoloDissolve) {
    for (let i = 0; i < 6; i++) {
      const prog = (state.t * 0.75 + i * 0.17) % 1;
      const side = (i % 2 === 0) ? -1 : 1;
      const dx = px + side * (12 + prog * 10 + Math.sin(state.t * 3 + i) * 3);
      const dy = act.gy - 48 - prog * 28;
      ctx.globalAlpha = Math.sin(prog * Math.PI) * 0.85;
      ctx.fillStyle = (state.act === 'act1' && !state.corrupt) ? (i % 2 === 0 ? '#ffd984' : '#f5ecd8') : '#92f5ec';
      ctx.fillRect(Math.round(dx), Math.round(dy), 2, 2);
    }
  }
  ctx.restore();

  // Player (hooded in Act 1-2 like char_me, unmasked in Act 3-4 revealing Vaelen face; `dissolve` in Solo!)
  const near = interactTarget();
  const isSoloFade = (state.act === 'act3' && state.solo);
  const ptag = state.hooded
    ? (state.moving ? 'hooded_walk' : 'hooded')
    : (state.moving ? 'walk' : (isSoloFade ? 'dissolve' : (near && near.key === 'prop_puddle' ? 'puddle' : (state.dlg ? 'pulse' : 'idle'))));
  drawSprite('char_protag', ptag, px, act.gy + 2, { scale: 1.18, facing: state.facing, t: state.t });

  // Foreground entities overlapping dock lip (Leviathan bow below boardwalk!)
  for (const en of act.entities) {
    if (!en.front) continue;
    const sx = en.x - cam; if (sx < -260 || sx > W + 260) continue;
    const tag = typeof en.tag === 'function' ? en.tag(state) : en.tag;
    drawSprite(en.key, tag, sx, act.gy + (en.yOff || 0), { scale: 1.08, facing: 1, t: state.t });
  }

  // 2D Point Lighting & Soft Theater Vignette (ALWAYS before Prompts/Dialog/HUD!)
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  drawPointLight(coreX, act.coreY, 160 * act.coreScale, state.corrupt ? '145,220,255' : '255,212,126', 0.18);
  for (const d of (act.decor || [])) {
    if (!ASSETS[d.key]) continue;
    const sx = d.x - cam; if (sx < -120 || sx > W + 120) continue;
    const col = d.tag === 'prism_crystal' ? '155,218,255' : '255,204,116';
    drawPointLight(sx, act.gy - 18, 72, col, 0.16);
  }
  for (const en of act.entities) {
    if (en.hidden && en.hidden(state)) continue;
    const sx = en.x - cam; if (sx < -160 || sx > W + 160) continue;
    if (en.key === 'prop_campfire') {
      drawPointLight(sx, act.gy - 24, state.corrupt ? 86 : 148, state.corrupt ? '120,174,210' : '255,176,82', state.corrupt ? 0.12 : 0.24);
    } else if (en.key === 'prop_cocoon') {
      drawPointLight(sx, act.gy - 36, 128, '255,194,96', 0.20);
    } else if (en.key === 'prop_fox_egg') {
      drawPointLight(sx, act.gy - 18, 92, '255,232,168', 0.18);
    } else if (en.key === 'prop_stele_trong') {
      drawPointLight(sx, act.gy - 40, 124, state.corrupt ? '138,178,208' : '255,214,116', state.corrupt ? 0.12 : 0.22);
    } else if (en.key === 'prop_amber_fleck' || en.key === 'wp_world_props') {
      drawPointLight(sx, act.gy - 22, 82, '255,206,120', 0.16);
    } else if (en.key === 'comp_linh' && state.act === 'act3') {
      drawPointLight(sx, act.gy - 32, 146, '255,212,132', 0.22);
    } else if (en.key === 'battle_soul') {
      drawPointLight(sx, act.gy + (en.yOff || 0), 96, state.corrupt ? '232,122,122' : '255,218,128', 0.18);
    } else if (en.key === 'cre_prismweaver') {
      drawPointLight(sx, act.gy - 18, 86, '168,236,255', 0.17);
    }
  }
  ctx.restore();

  ctx.save();
  const vg = ctx.createRadialGradient(W / 2, H / 2, W * 0.32, W / 2, H / 2, W * 0.72);
  vg.addColorStop(0, 'rgba(4,6,12,0)');
  vg.addColorStop(1, 'rgba(4,6,12,0.38)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  ctx.restore();

  if (near && !state.dlg && !state.hudHidden) {
    const lb = near.name;
    const bw = measureW(lb, 16, 'ui') + 54;
    const bx = Math.max(20, Math.min(W - bw - 20, px - bw / 2));
    const by = act.gy - 134;
    ctx.fillStyle = 'rgba(10,11,18,0.84)'; ctx.fillRect(bx, by, bw, 30);
    ctx.strokeStyle = 'rgba(240,199,106,0.55)'; ctx.strokeRect(bx, by, bw, 30);
    ctx.fillStyle = 'rgba(240,199,106,0.22)'; ctx.fillRect(bx + 8, by + 5, 20, 20);
    txt('E', bx + 18, by + 15, 13, '#f0c76a', 'center', 'mono');
    txt(lb, bx + 36, by + 15, 16, '#f4ecd8', 'left', 'ui');
  }

  if (state.dlg) {
    ctx.fillStyle = 'rgba(10,11,18,0.92)'; ctx.fillRect(60, H - 184, W - 120, 152);
    ctx.strokeStyle = 'rgba(240,199,106,0.5)'; ctx.lineWidth = 1.5; ctx.strokeRect(60, H - 184, W - 120, 152);
    const pKey = (state.dlg.port === 'protag_warm' && state.hooded) ? 'protag_hooded' : state.dlg.port;
    if (pKey) {
      ctx.fillStyle = '#151724'; ctx.fillRect(82, H - 166, 102, 108);
      ctx.strokeStyle = 'rgba(240,199,106,0.45)'; ctx.strokeRect(82, H - 166, 102, 108);
      drawSprite('hollow_portraits', pKey, 133, H - 112, { scale: 0.96, t: state.t });
    }
    txt(state.dlg.name, 204, H - 152, 18, '#f0c76a', 'left', 'label');
    wrap(state.dlg.text, W - 300, 20, 'story').slice(0, 3).forEach((ln, i) => txt(ln, 204, H - 116 + i * 28, 20, '#f3ebd8', 'left', 'story'));
    txt('Space / E: đóng', W - 82, H - 48, 13, '#9a9380', 'right', 'ui');
  } else if (!state.hudHidden) {
    const subLines = wrap(act.sub, 408, 14, 'thought');
    const bw = 440, bh = 48 + subLines.length * 20;
    ctx.fillStyle = 'rgba(10,12,20,0.78)'; ctx.fillRect(20, 62, bw, bh);
    ctx.strokeStyle = 'rgba(240,199,106,0.28)'; ctx.strokeRect(20, 62, bw, bh);
    txt(act.name, 36, 84, 19, '#f0e8d0', 'left', 'display');
    subLines.forEach((ln, i) => txt(ln, 36, 110 + i * 20, 14, '#cfc7b2', 'left', 'thought'));

    // Diegetic Companion HUD (Linh HP + Kaelen Warmth + Mira Abacus) — vanishes completely in Act 3 Solo!
    if (!(state.act === 'act3' && state.solo)) {
      drawSprite('ui_hud_linh', state.corrupt ? 'low' : 'active', 896, 62, { scale: 0.5, t: state.t });
      drawSprite('ui_hud_kael', state.corrupt ? 'cold' : 'warm', 1026, 62, { scale: 0.5, t: state.t });
      drawSprite('ui_hud_mira', state.corrupt ? 'zero' : 'active', 1140, 62, { scale: 0.5, t: state.t });
    } else {
      ctx.fillStyle = 'rgba(10,12,20,0.72)'; ctx.fillRect(948, 62, 312, 34);
      ctx.strokeStyle = 'rgba(143,245,232,0.35)'; ctx.strokeRect(948, 62, 312, 34);
      txt('Mất đồng đội — Diegetic HUD đã tắt', 1104, 79, 13, '#9a9380', 'center', 'thought');
    }
  }
}

  wrap(card.desc, 610, 17, 'story').forEach((ln, i) => txt(ln, 684, 488 + i * 26, 17, '#e8e0cc', 'center', 'story'));

function drawCutsceneOverlay() {
  const cs = CUTSCENES[state.csIdx % CUTSCENES.length];
  const barH = Math.round(H * 0.12); // 12% Cinema Letterbox (86px top + 86px bottom)
  ctx.fillStyle = 'rgba(7,8,13,0.92)'; ctx.fillRect(0, 0, W, H);

  // Subtle ambient backlight around the 160x90 pixel insert panel
  const glow = ctx.createRadialGradient(W / 2, 248, 24, W / 2, 248, 300);
  glow.addColorStop(0, 'rgba(255,214,107,0.16)'); glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, barH, W, H - barH * 2);

  txt(cs.title, W / 2, 106, 17, '#f0c76a', 'center', 'display');
  drawSprite(cs.key, 'idle', W / 2, 248, { scale: 1.32, t: state.t });

  // Dual-Pulse Inner Voice Debate (60 BPM Architect Monospace vs 85 BPM Symbiosis Serif)
  const archPulse = Math.pow(Math.max(0, Math.sin(state.t * Math.PI * (60 / 60))), 6);
  const symbPulse = Math.pow(Math.max(0, Math.sin(state.t * Math.PI * (85 / 60))), 6);

  // Left Box: [NHỊP KIẾN TRÚC - 60 BPM] — Square cold geometric box
  const lx = 56, ly = 392, lw = 566, lh = 220;
  ctx.fillStyle = 'rgba(9,16,32,0.95)'; ctx.fillRect(lx, ly, lw, lh);
  ctx.strokeStyle = `rgba(155,227,255,${0.55 + archPulse * 0.45})`; ctx.lineWidth = 2;
  ctx.strokeRect(lx, ly, lw, lh);

  byInfo += 5;
  txt('Cộng sinh:', 858, byInfo, 11, '#8ff5e8', 'left', 'label');
  byInfo += 15;
  wrap(symTxt, 222, 11, 'ui').slice(0, 4).forEach((ln) => {
    txt(ln, 858, byInfo, 11, '#dff8f0', 'left', 'ui');
    byInfo += 14;
  });

  const payY = Math.max(352, byInfo + 8);
  wrap(`★ ${curBeast.act4Payoff || curBeast.payoff || ''}`, 534, 12, 'thought').slice(0, 3).forEach((ln, i) => txt(ln, 674, payY + i * 16, 12, '#ffd66b', 'left', 'thought'));

  // Symbiosis Wheel Simulator (bottom right)
  ctx.fillStyle = 'rgba(13,18,34,0.84)'; ctx.fillRect(656, 424, 566, 240);
  ctx.strokeStyle = 'rgba(143,245,232,0.34)'; ctx.strokeRect(656, 424, 566, 240);
  txt('SPEC VÒNG HÀNH ĐỘNG CỘNG SINH (TopDownSymbiosisWheel)', 939, 444, 12, '#8df5ff', 'center', 'mono');

  const wActions = [
    { key: 'listen', num: '1', label: 'Lắng Nghe', col: '#9be3ff' },
    { key: 'feed',   num: '2', label: 'Cho Ăn / Soi', col: '#ffd66b' },
    { key: 'heal',   num: '3', label: 'Chữa Trị', col: '#8ff5e8' },
  ];
  wActions.forEach((wa, idx) => {
    const bx = 674 + idx * 180, by = 468, bw = 168, bh = 86, sel = state.wheelSel === idx;
    ctx.fillStyle = sel ? 'rgba(240,199,106,0.20)' : 'rgba(255,255,255,0.05)'; ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = sel ? '#ffd66b' : wa.col; ctx.strokeRect(bx, by, bw, bh);
    const drawn = drawSprite('ui_symbiosis_wheel', wa.key, bx + bw / 2, by + 30, { scale: 0.56, t: sel ? 0.25 : 0 });
    if (!drawn) {
      ctx.fillStyle = wa.col;
      ctx.beginPath(); ctx.arc(bx + bw / 2, by + 30, 12, 0, Math.PI * 2); ctx.fill();
    }
    const wObj = curBeast.wheel && curBeast.wheel[wa.key];
    const lbl = (wObj && wObj.label) ? `${wa.num} · ${wObj.label}` : `${wa.num} · ${wa.label}`;
    txt(lbl, bx + bw / 2, by + 70, 11, '#f4ecd8', 'center', 'label');
    state.buttons.push({
      x: bx, y: by, w: bw, h: bh,
      fn: () => {
        state.wheelSel = idx;
        state.wheelMsg = typeof wObj === 'string' ? wObj : (wObj && (wObj.reaction || wObj.text)) || '';
      },
    });
  });

  const activeWheel = wActions[state.wheelSel % 3];
  const defaultWheelObj = curBeast.wheel && curBeast.wheel[activeWheel.key];
  const shownReaction = state.wheelMsg || (typeof defaultWheelObj === 'string' ? defaultWheelObj : (defaultWheelObj && (defaultWheelObj.reaction || defaultWheelObj.text)) || '');
  ctx.fillStyle = 'rgba(8,10,16,0.88)'; ctx.fillRect(674, 570, 530, 78);
  ctx.strokeStyle = 'rgba(240,199,106,0.28)'; ctx.strokeRect(674, 570, 530, 78);
  const activeLbl = (defaultWheelObj && defaultWheelObj.label) || activeWheel.label;
  txt(`Phản hồi (${activeWheel.num} · ${activeLbl}):`, 690, 588, 11, activeWheel.col, 'left', 'mono');
  wrap(shownReaction, 496, 13, 'story').slice(0, 2).forEach((ln, i) => txt(ln, 690, 610 + i * 19, 13, '#f4ecd8', 'left', 'story'));
}

function drawEndingsView() {
  ctx.fillStyle = '#0c0e16'; ctx.fillRect(0, 0, W, H);
  txt('3 NHÁNH KẾT THÚC CHÍNH & BẢNG ĐIỀU KIỆN STATE FLAGS (v4.3)', W / 2, 68, 16, '#f0c76a', 'center', 'display');

  const endings = getEndingsList();
  endings.forEach((ed, idx) => {
    const x = 42 + idx * 402, y = 86, w = 390, h = 414;
    ctx.fillStyle = 'rgba(255,255,255,0.028)'; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = ed.toneColor || '#f0c76a'; ctx.strokeRect(x, y, w, h);

    // Diorama Stage Preview Box
    const sx = x + 12, sy = y + 10, sw = w - 24, sh = 148;
    const d = ed.diorama || {};
    ctx.fillStyle = ed.bgTone || (idx === 0 ? '#1f1620' : (idx === 1 ? '#131d2d' : '#10121c'));
    ctx.fillRect(sx, sy, sw, sh);
    ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.strokeRect(sx, sy, sw, sh);

    if (idx === 0) {
      const glow = ctx.createRadialGradient(sx + sw / 2, sy + 82, 8, sx + sw / 2, sy + 82, 120);
      glow.addColorStop(0, 'rgba(255,196,96,0.28)'); glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow; ctx.fillRect(sx, sy, sw, sh);
      drawSprite(d.hut || 'env_hut_lantern', d.hutTag || 'lit', sx + 74, sy + 128, { scale: 0.78, t: state.t });
      drawSprite(d.fire || 'prop_campfire', d.fireTag || 'warm', sx + sw / 2, sy + 132, { scale: 0.75, t: state.t });
      if (ASSETS[d.music || 'fx_music_box']) drawSprite(d.music || 'fx_music_box', d.musicTag || 'intact', sx + sw - 68, sy + 128, { scale: 0.9, t: state.t });
      drawSprite('comp_kael', 'soup', sx + sw / 2 - 42, sy + 130, { scale: 0.65, t: state.t });
      drawSprite('comp_linh', 'idle', sx + sw / 2 + 42, sy + 130, { scale: 0.65, t: state.t });
      for (let i = 0; i < 6; i++) drawSprite('fx_hearth_wisp', d.wispTag || (i % 2 === 0 ? 'gold' : 'mint'), sx + 48 + i * 56, sy + 28 + Math.sin(state.t * 2 + i) * 8, { scale: 0.68, t: state.t });
    } else if (idx === 1) {
      drawSprite('prop_leviathan', 'idle', sx + 104, sy + 102, { scale: 0.48, t: state.t });
      drawSprite(d.puddle || 'prop_puddle', d.puddleTag || 'solo_fade', sx + sw / 2 + 30, sy + 134, { scale: 0.72, t: state.t });
      drawSprite('char_protag', 'idle', sx + sw / 2 + 12, sy + 126, { scale: 0.74, t: state.t });
      drawSprite('cre_echofox', 'chime', sx + sw / 2 + 72, sy + 128, { scale: 0.72, t: state.t });
      for (let i = 0; i < 5; i++) drawSprite('fx_hearth_wisp', d.wispTag || 'mint', sx + 56 + i * 64, sy + 26 + Math.cos(state.t * 2 + i) * 8, { scale: 0.62, t: state.t });
    } else {
      ctx.save();
      for (let c = -2; c <= 2; c++) {
        if (c === 0) continue;
        ctx.strokeStyle = 'rgba(143,247,255,0.45)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(sx + sw / 2 + c * 10, sy + 56); ctx.lineTo(sx + sw / 2 + c * 30, sy); ctx.stroke();
      }
      ctx.restore();
      drawSprite('prop_debt_pillar', 'locked', sx + 58, sy + 132, { scale: 0.48, t: state.t });
      drawSprite('prop_debt_pillar', 'locked', sx + sw - 58, sy + 132, { scale: 0.48, t: state.t });
      drawSprite(d.vaelen || 'boss_vaelen', d.vaelenTag || 'cabled', sx + sw / 2, sy + 110, { scale: 0.68, t: state.t });
      if (ASSETS[d.music || 'fx_music_box']) drawSprite(d.music || 'fx_music_box', d.musicTag || 'shattered', sx + 114, sy + 134, { scale: 0.85, t: state.t });
      drawSprite(d.puddle || 'prop_puddle', d.puddleTag || 'corrupt', sx + sw / 2, sy + 136, { scale: 0.68, t: state.t });
    }

    txt(ed.title, x + w / 2, y + 172, 16, ed.toneColor || '#f0c76a', 'center', 'display');
    wrap(ed.flagCondition || '', w - 26, 10, 'mono').slice(0, 2).forEach((ln, i) => txt(ln, x + w / 2, y + 192 + i * 13, 10, '#9ee8ff', 'center', 'mono'));
    wrap(`"${ed.puddleQuote || ''}"`, w - 30, 12, 'thought').slice(0, 3).forEach((ln, i) => txt(ln, x + 16, y + 224 + i * 16, 12, '#fff1d4', 'left', 'thought'));

    let by = y + 282;
    for (const det of (ed.details || []).slice(0, 3)) {
      wrap('· ' + det, w - 30, 11, 'ui').slice(0, 2).forEach((ln) => {
        txt(ln, x + 16, by, 11, '#d4ccb8', 'left', 'ui');
        by += 15;
      });
      by += 6;
    }
  });

  // Bottom State Flags Table (10 vars wrapped cleanly within 1196px)
  ctx.fillStyle = 'rgba(13,18,34,0.84)'; ctx.fillRect(42, 508, 1196, 176);
  ctx.strokeStyle = 'rgba(143,245,232,0.28)'; ctx.strokeRect(42, 508, 1196, 176);
  txt('BẢNG ĐỒNG BỘ STATE FLAGS & BIẾN HỆ THỐNG (PHẦN V · v4.3)', 640, 523, 12, '#8df5ff', 'center', 'mono');
  const rows = getStateFlagsRows().slice(0, 10);
  rows.forEach((row, idx) => {
    const col = idx < 5 ? 0 : 1, rIdx = idx % 5;
    const rx = 56 + col * 594, ry = 544 + rIdx * 28;
    const keyName = Array.isArray(row) ? row[0] : (row.name || row.key || '');
    const descTxt = Array.isArray(row) ? row[1] : (row.desc || row.description || '');
    txt(keyName, rx, ry, 10, '#ffd66b', 'left', 'mono');
    wrap(descTxt, 366, 10, 'ui').slice(0, 2).forEach((ln, li) => txt(ln, rx + 206, ry + li * 12, 10, '#dcd4c0', 'left', 'ui'));
  });
}

function drawHUD() {
  if (state.hudHidden || state.cutsceneMode) return;
  ctx.fillStyle = 'rgba(10,12,18,0.88)'; ctx.fillRect(0, 0, W, 48);
  ctx.strokeStyle = 'rgba(240,199,106,0.25)'; ctx.beginPath(); ctx.moveTo(0, 48); ctx.lineTo(W, 48); ctx.stroke();

  const pills = [
    { label: 'Tab Hồ Sơ', fn: () => { state.view = state.view === 'chars' ? 'world' : 'chars'; state.dlg = null; }, active: state.view === 'chars' },
    { label: 'I Cận Cảnh', fn: () => { state.view = state.view === 'gallery' ? 'world' : 'gallery'; state.dlg = null; }, active: state.view === 'gallery' },
    { label: 'B Boss H4', fn: () => { state.view = state.view === 'boss' ? 'world' : 'boss'; state.dlg = null; }, active: state.view === 'boss' },
    { label: 'J Túi & SV', fn: () => { state.view = state.view === 'bag' ? 'world' : 'bag'; state.dlg = null; }, active: state.view === 'bag' },
    { label: 'O 3 Kết Thúc', fn: () => { state.view = state.view === 'endings' ? 'world' : 'endings'; state.dlg = null; }, active: state.view === 'endings' },
    { label: 'C Cutscene', fn: () => { state.cutsceneMode = !state.cutsceneMode; state.dlg = null; }, active: state.cutsceneMode },
    { label: 'L Kit Cũ', fn: () => { state.view = state.view === 'legacy' ? 'world' : 'legacy'; state.dlg = null; }, active: state.view === 'legacy' },
    { label: 'T Top-Down', fn: () => { location.href = 'topdown_maps.html'; }, active: false },
    { label: '1 Phế Liệu', fn: () => { state.view = 'world'; setAct('act1'); }, active: state.view === 'world' && state.act === 'act1' },
    { label: '2 Kình Ngư', fn: () => { state.view = 'world'; setAct('act2'); }, active: state.view === 'world' && state.act === 'act2' },
    { label: '3 Hầm', fn: () => { state.view = 'world'; setAct('act3'); }, active: state.view === 'world' && state.act === 'act3' },
    { label: '4 Lõi', fn: () => { state.view = 'world'; setAct('act4'); }, active: state.view === 'world' && state.act === 'act4' },
    { label: 'M ' + (state.corrupt ? 'Tha Hóa' : 'Tuyến'), fn: () => { state.corrupt = !state.corrupt; }, active: state.corrupt },
    { label: 'S ' + (state.solo ? 'Độc Hành' : 'Đoàn Tụ'), fn: () => { state.solo = !state.solo; if (state.view === 'gallery') state.hudAlt = state.solo; }, active: state.solo },
    { label: 'U ' + (state.hooded ? 'Mũ' : 'Mặt'), fn: () => { state.hooded = !state.hooded; }, active: state.hooded },
    { label: 'H Ẩn', fn: () => { state.hudHidden = true; }, active: false },
  ];
  let bx = 8;
  for (const p of pills) {
    const pw = Math.round(measureW(p.label, 10, 'ui') + 8);
    ctx.fillStyle = p.active ? 'rgba(240,199,106,0.22)' : 'rgba(255,255,255,0.06)'; ctx.fillRect(bx, 10, pw, 28);
    ctx.strokeStyle = p.active ? '#f0c76a' : 'rgba(255,255,255,0.16)'; ctx.strokeRect(bx, 10, pw, 28);
    txt(p.label, bx + pw / 2, 24, 10, p.active ? '#f0c76a' : '#e8e0cc', 'center', 'ui');
    state.buttons.push({ x: bx, y: 10, w: pw, h: 28, fn: p.fn });
    bx += pw + 3;
  }

  ctx.fillStyle = 'rgba(8,9,14,0.82)'; ctx.fillRect(0, H - 28, W, 28);
  txt('A/D: đi · E: thoại/đổi · 1..4: Hồi · Tab/I/B/J/O/C/L/T: Hồ sơ / Cận cảnh / Boss / Túi & SV / 3 Kết thúc / Cutscene / Kit cũ / Top-Down · U/M/S/H', W / 2, H - 14, 11, '#b8b09a', 'center', 'ui');
}

function drawFrame() {
  state.buttons = [];
  if (state.view === 'world') drawWorld();
  else if (state.view === 'chars') drawCharSheet();
  else if (state.view === 'gallery') drawGallery();
  else if (state.view === 'boss') drawBossSpec();
  else if (state.view === 'bag') drawBagBestiaryView();
  else if (state.view === 'endings') drawEndingsView();
  else drawLegacyKit();
  if (state.cutsceneMode) drawCutsceneOverlay();
  drawHUD();
}

let last = performance.now() / 1000, acc = 0;
function loop() {
  const now = performance.now() / 1000;
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { stepOnce(); hit.clear(); acc -= STEP; }
  drawFrame(); requestAnimationFrame(loop);
}

window.hollowShowcase = {
  get state() { return state; },
  ready: Promise.all(READY_PROMISES),
  setView(v) { state.view = v; state.dlg = null; drawFrame(); },
  setAct(id) { setAct(id); drawFrame(); },
  selectItem(idx) { state.itemIdx = ((idx % 7) + 7) % 7; drawFrame(); },
  selectBeast(idx) { state.beastIdx = ((idx % 4) + 4) % 4; state.wheelMsg = ''; drawFrame(); },
  setBagContext(c) { state.bagCtx = c; drawFrame(); },
  pickWheel(actOrIdx) {
    const beasts = getBestiaryList();
    const b = beasts[state.beastIdx % beasts.length];
    const keys = ['listen', 'feed', 'heal'];
    const idx = typeof actOrIdx === 'number' ? actOrIdx : keys.indexOf(actOrIdx);
    state.wheelSel = idx >= 0 ? idx : 0;
    const k = keys[state.wheelSel];
    const wObj = b.wheel && b.wheel[k];
    state.wheelMsg = typeof wObj === 'string' ? wObj : (wObj && (wObj.reaction || wObj.text)) || '';
    drawFrame();
  },
  setRoute(corrupt) { state.corrupt = !!corrupt; drawFrame(); },
  setSolo(solo) { state.solo = !!solo; state.hudAlt = state.solo; drawFrame(); },
  setHooded(h) { state.hooded = !!h; drawFrame(); },
  setCutscene(on, idx) { state.cutsceneMode = !!on; if (idx !== undefined) state.csIdx = ((idx % CUTSCENES.length) + CUTSCENES.length) % CUTSCENES.length; state.dlg = null; drawFrame(); },
  setMiteRemoved(v) { state.miteRemoved = !!v; drawFrame(); },
  breakPillar(idx, v = true) { if (idx >= 0 && idx < 4) state.pillars[idx] = !!v; drawFrame(); },
  setBossPurified(v) { if (v) state.pillars = [true, true, true, true]; state.bossPurified = !!v; drawFrame(); },
  setFoxRescue(v) { state.foxRescue = !!v; drawFrame(); },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  step(n = 1, draw = true) { for (let i = 0; i < n; i++) { stepOnce(); hit.clear(); } if (draw) drawFrame(); },
};

if (params.get('manual') === '1') drawFrame();
else requestAnimationFrame(loop);
</script>
</body>
</html>

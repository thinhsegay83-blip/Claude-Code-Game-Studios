<script>
'use strict';
// Trong · Hồi 1 · Kẻ Trắng Tay. Đọc HANDOVER_STORY_V2.md: mọi chữ và bản đồ ở story.js,
// mọi con số ở config.js; tệp này là engine: StoryStateManager + Event Bus, cảnh thoại,
// đi lại, màn né đòn, túi đồ và phần vẽ.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value });
const STEP = 1 / 60;
const W = 1280, H = 720;
const PIXEL = false;
const FONT = 'Georgia, "Times New Roman", serif';
const S = window.STORY;
const TITLE = S.ui.title;
const CONTROLS = S.ui.controls;
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 };
const CHEAP = params.get('render') === 'cheap';
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = [];

// ---- Screen ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function fit() {
  const k = Math.min(innerWidth / W, innerHeight / H);
  const s = PIXEL ? Math.max(1, Math.floor(k)) : k;
  const r = PIXEL ? 1 : s * (devicePixelRatio || 1);
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  canvas.style.width = Math.round(W * s) + 'px'; canvas.style.height = Math.round(H * s) + 'px';
  canvas.style.marginTop = Math.max(0, Math.floor((innerHeight - H * s) / 2)) + 'px';
  ctx.setTransform(r, 0, 0, r, 0, 0); ctx.imageSmoothingEnabled = !PIXEL;
}
addEventListener('resize', fit); fit();
function clear(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function text(s, x, y, size, c, align = 'center', style = '') {
  ctx.fillStyle = c; ctx.font = `${style}${size}px ${FONT}`; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function wrap(s, maxW, size, style = '') {
  ctx.font = `${style}${size}px ${FONT}`;
  const words = String(s).split(' '), lines = []; let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function lerp(a, b, t) { return a + (b - a) * clamp(t, 0, 1); }
function mix(c1, c2, t) {
  return `rgb(${Math.round(lerp(c1[0], c2[0], t))},${Math.round(lerp(c1[1], c2[1], t))},${Math.round(lerp(c1[2], c2[2], t))})`;
}
function glow(c, b) { ctx.shadowColor = c; ctx.shadowBlur = CHEAP ? 0 : b; }
function noglow() { ctx.shadowBlur = 0; }
function panel(x, y, w, h, a = 0.86) {
  ctx.fillStyle = `rgba(14,12,20,${a})`; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = 'rgba(240,226,192,0.35)'; ctx.lineWidth = 1.5; ctx.strokeRect(x, y, w, h);
}

// ---- Sprite vẽ bằng Aseprite -----------------------------------------------------------
// assets/sprites/sprites.js (sinh bởi art/export.ps1) khai báo window.SPRITES[id] = JSON của
// Aseprite; ảnh là assets/sprites/<id>.png. Có sprite thì vẽ sprite (pixel, phóng sprite_scale,
// neo giữa đáy, quay phải); chưa có thì các hàm draw* bên dưới vẽ bằng code như cũ.
const SPR = {};
for (const id in (window.SPRITES || {})) {
  const img = new Image();
  img.onerror = () => console.warn('Không đọc được sprite', id);
  img.src = `assets/sprites/${id}.png`;
  SPR[id] = { img, data: window.SPRITES[id] };
}
function sprReady(id) { const s = SPR[id]; return !!s && s.img.complete && s.img.naturalWidth > 0 && !!s.data && Array.isArray(s.data.frames); }
function sprFrame(id, tag, t) {
  const frames = SPR[id].data.frames, tags = (SPR[id].data.meta && SPR[id].data.meta.frameTags) || [];
  const tg = tags.find(x => x.name === tag) || tags.find(x => x.name === 'idle') || tags[0] || { from: 0, to: frames.length - 1 };
  let total = 0;
  for (let i = tg.from; i <= tg.to; i++) total += frames[i].duration || 100;
  let ms = ((t * 1000) % total + total) % total;
  for (let i = tg.from; i <= tg.to; i++) { ms -= frames[i].duration || 100; if (ms < 0) return frames[i]; }
  return frames[tg.to];
}
function drawSprite(id, tag, t, x, y, facing = 1, extra = 1) {
  if (!sprReady(id)) return false;
  const s = tune.sprite_scale * Math.max(1, Math.round(extra)), fr = sprFrame(id, tag, t).frame; // chỉ phóng nguyên lần: điểm ảnh luôn vuông
  ctx.save(); ctx.imageSmoothingEnabled = false;
  ctx.translate(Math.round(x / s) * s, Math.round(y / s) * s); ctx.scale(facing < 0 ? -1 : 1, 1);
  ctx.drawImage(SPR[id].img, fr.x, fr.y, fr.w, fr.h, -Math.round(fr.w / 2) * s, -fr.h * s, fr.w * s, fr.h * s);
  ctx.restore();
  return true;
}
function bodyTag() { return state && state.moving ? 'walk' : 'idle'; }

// ---- Input ------------------------------------------------------------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code);
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('pointerdown', () => startAudio());
addEventListener('blur', () => down.clear());
function digitPressed(n) { for (let i = 1; i <= n; i++) if (pressed('Digit' + i) || pressed('Numpad' + i)) return i; return 0; }
const advance = () => pressed('Space') || pressed('Enter') || pressed('KeyE');

// ---- Audio ------------------------------------------------------------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)();
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
    out.connect(ac.destination); audio = { ac, out };
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted));
function tone(freq, dur, type = 'sine', vol = 0.3, when = 0) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime + when, o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur);
}
const sfx = {
  blip: () => tone(620, 0.03, 'triangle', 0.04),
  pick: () => { tone(523, 0.12, 'sine', 0.1); tone(784, 0.2, 'sine', 0.08, 0.08); },
  coin: () => { tone(1318, 0.08, 'triangle', 0.08); tone(1760, 0.12, 'triangle', 0.06, 0.06); },
  pen: () => { for (let i = 0; i < 4; i++) tone(2200 + i * 90, 0.02, 'sawtooth', 0.02, i * 0.03); }, // sổ xanh: tiếng bút sột soạt
  hurt: () => tone(110, 0.2, 'square', 0.16),
  graze: () => tone(1500, 0.05, 'sine', 0.05),
  chime: () => { tone(880, 0.4, 'sine', 0.08); tone(1320, 0.6, 'sine', 0.05, 0.05); }, // SFX_CHIME_RESONANCE
  boom: () => { tone(70, 0.6, 'sawtooth', 0.25); tone(55, 0.8, 'square', 0.15, 0.05); },
  beat: () => { tone(58, 0.14, 'sine', 0.22); tone(52, 0.14, 'sine', 0.16, 0.22); }, // SFX_DOUBLE_HEARTBEAT
  calm: () => { tone(392, 0.3, 'sine', 0.08); tone(494, 0.4, 'sine', 0.06, 0.1); },
  strike: () => { tone(160, 0.12, 'square', 0.16); tone(90, 0.25, 'sawtooth', 0.1, 0.04); },
};

// ---- Lưu --------------------------------------------------------------------------------
function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
if (load('trong2_speed')) CONFIG.text_speed.value = load('trong2_speed');

// ==== EVENT BUS + STORY STATE MANAGER =========================================================
// Mọi biến cốt truyện ở Bước 4 của handover sống ở state.v. Đổi biến chỉ qua Story.set/add,
// nên mỗi lần đổi đều phát sự kiện 'var:<tên>'; các hệ thống (chợ, sinh vật, bạn đồng hành,
// giao diện) nghe sự kiện và tự cập nhật, không ai phải gọi chúng.
const Bus = {
  subs: {},
  on(ev, fn) { (this.subs[ev] = this.subs[ev] || []).push(fn); },
  emit(ev, data) { for (const fn of this.subs[ev] || []) { try { fn(data); } catch (e) { console.error('bus', ev, e); } } },
};
const VAR_RANGE = { // handover Bước 4: kiểu và miền giá trị
  int_puddle_check_count: [0, 1e9], var_identity_revelation_stage: [0, 4], int_clue_fragments_found: [0, 12],
  var_architect_corruption: [0, 100], var_lumen_gold: [0, 1e9], var_linh_tab_debt: [0, 1e9],
  var_memoria_coins: [0, 1e9], var_eco_balance: [0, 100],
  var_bond_linh: [0, 100], var_bond_kael: [0, 100], var_bond_mira: [0, 100],
};
function freshVars() {
  return {
    int_puddle_check_count: 0, var_identity_revelation_stage: 0, int_clue_fragments_found: 0,
    var_architect_corruption: 0, flag_party_unbreakable_bond: false,
    var_lumen_gold: tune.start_lumen, var_linh_tab_debt: 0, var_memoria_coins: 0,
    var_eco_balance: tune.start_eco,
    var_bond_linh: tune.start_bond, var_bond_kael: tune.start_bond, var_bond_mira: tune.start_bond,
  };
}
const Story = {
  get(k) { return state.v[k]; },
  set(k, val) {
    if (!(k in VAR_RANGE) && !(k in state.v)) { console.warn('Story: biến lạ', k); }
    const r = VAR_RANGE[k], old = state.v[k];
    const v = r && typeof val === 'number' ? clamp(Math.round(val), r[0], r[1]) : val;
    state.v[k] = v;
    if (old !== v) { Bus.emit('var:' + k, { k, old, v }); Bus.emit('var', { k, old, v }); events.push({ type: 'var', k, v }); }
  },
  add(k, d) { this.set(k, (state.v[k] || 0) + d); },
  flag(k, v = true) { const old = state.flags[k]; state.flags[k] = v; if (old !== v) Bus.emit('flag:' + k, v); },
  has(id) { return (state.items[id] || 0) > 0; },
  addItem(id, n = 1) { state.items[id] = (state.items[id] || 0) + n; Bus.emit('item', id); sfx.pick(); },
  removeItem(id, n = 1) { state.items[id] = Math.max(0, (state.items[id] || 0) - n); if (!state.items[id]) delete state.items[id]; Bus.emit('item', id); },
  // Chạy một hiệu ứng dạng chữ từ story.js: 'var_bond_kael+15', 'flag_x=true', 'item+egg',
  // 'var_eco_balance+eco_feed' (vế phải có thể là tên một giá trị trong config.js), 'debt', 'buy:bread'.
  run(fx) {
    for (const e of fx || []) {
      try {
        let m;
        if (e === 'debt') { this.add('var_linh_tab_debt', tune.linh_fee); continue; }
        if ((m = e.match(/^buy:(\w+)$/))) { buy(m[1]); continue; }
        if ((m = e.match(/^item([+-])(\w+)$/))) { m[1] === '+' ? this.addItem(m[2]) : this.removeItem(m[2]); continue; }
        if ((m = e.match(/^(\w+)\s*([+\-=])\s*(.+)$/))) {
          const [, k, op, raw] = m;
          const val = raw === 'true' ? true : raw === 'false' ? false : isNaN(Number(raw)) ? tune[raw] : Number(raw);
          if (k.startsWith('flag_') && !(k in state.v)) { this.flag(k, op === '=' ? val : true); continue; }
          if (op === '=') this.set(k, val); else this.add(k, op === '+' ? val : -val);
          continue;
        }
        console.warn('Story.run: không hiểu hiệu ứng', e);
      } catch (err) { console.error('Story.run', e, err); }
    }
  },
};
// ---- Người nghe: thế giới tự phản hồi ----
function breadPrice() { // giá chợ: sinh thái tốt thì rẻ, Bọ Ký Sinh còn thì thuế cao
  const eco = state.v.var_eco_balance;
  const tax = tune.market_tax * (state.flags.bugs_cleared ? 1 - tune.bug_tax_cut : 1);
  return Math.max(1, Math.round(tune.bread_base * (1 + tune.bread_eco_swing * (50 - eco) / 50) * (1 + tax)));
}
function wireListeners() {
  Bus.subs = {};
  Bus.on('var:var_eco_balance', () => { state.breadPrice = breadPrice(); state.foxShy = state.v.var_eco_balance < 40; });
  Bus.on('flag:bugs_cleared', () => { state.breadPrice = breadPrice(); });
  Bus.on('var:var_linh_tab_debt', () => { state.debtFlash = state.t; sfx.pen(); });
  Bus.on('var:var_lumen_gold', d => { state.coinFlash = { t: state.t, d: d.v - d.old }; if (d.v > d.old) sfx.coin(); });
  Bus.on('var:var_memoria_coins', d => { state.coinFlash = { t: state.t, d: 0, mem: d.v - d.old }; });
  Bus.on('var:var_architect_corruption', () => { state.coldTarget = state.v.var_architect_corruption / 100; });
  Bus.on('var:var_identity_revelation_stage', d => { if (d.v >= 1) { state.doublePulse = true; sfx.beat(); } });
  Bus.on('var:var_bond_kael', () => { state.kaelWarm = state.v.var_bond_kael >= 40; });
}
function view() {
  const has = {}; for (const k in state.items) has[k] = state.items[k] > 0;
  return {
    flags: state.flags, v: state.v, has, party: state.party, breadPrice: state.breadPrice,
    bondSum: state.v.var_bond_linh + state.v.var_bond_kael + state.v.var_bond_mira,
  };
}
function buy(what) {
  if (what === 'bread') {
    const p = state.breadPrice;
    if (state.v.var_lumen_gold < p) return;
    Story.add('var_lumen_gold', -p); Story.addItem('bread');
  }
}

// ---- Trạng thái -------------------------------------------------------------------------
let scene, state;
function freshState() {
  return {
    t: 0, score: 0, gained: '',
    mode: 'field', map: 'phelieu', x: 260, facing: 1, wob: 0,
    v: null, flags: {}, items: {}, party: [], goal: 'valley',
    trail: [], dlg: null, fight: null, travel: null, inv: null,
    walkline: null, walkq: [], shown: {}, log: [], logOff: 0, modeBack: 'field',
    breadPrice: 0, foxShy: false, debtFlash: -9, coinFlash: null, cold: 0, coldTarget: 0,
    doublePulse: false, kaelWarm: false, savedFlash: -9, endT: 0,
  };
}
function reset() {
  seed = Number(params.get('seed')) || CONFIG.seed;
  state = freshState();
  state.v = freshVars();
  wireListeners();
  state.breadPrice = breadPrice();
}
function saveGame() {
  store('trong2_save', { map: state.map, x: state.x, v: state.v, flags: state.flags, items: state.items, party: state.party, goal: state.goal });
  state.savedFlash = state.t;
}
function loadGame() {
  const s = load('trong2_save'); if (!s) return false;
  reset();
  Object.assign(state, { map: s.map, x: s.x, flags: s.flags || {}, items: s.items || {}, party: s.party || [], goal: s.goal });
  state.v = Object.assign(freshVars(), s.v);
  state.breadPrice = breadPrice(); state.foxShy = state.v.var_eco_balance < 40;
  state.doublePulse = state.v.var_identity_revelation_stage >= 1; state.kaelWarm = state.v.var_bond_kael >= 40;
  state.cold = state.coldTarget = state.v.var_architect_corruption / 100;
  return true;
}
function pushLog(who, t) { state.log.push({ who, t }); if (state.log.length > 120) state.log.shift(); state.logOff = 0; }

// ==== CẢNH THOẠI ==============================================================================
function startScene(id) {
  if (!S.scenes[id]) { console.error('Không có cảnh', id); return; }
  state.mode = 'dialog';
  state.dlg = { id, i: -1, chars: 0, line: null, choice: null, pick: 0 };
  nextStep();
}
function showLines(lines) { // đọc chuỗi dòng không người nói (đồ vật, vũng nước)
  state.mode = 'dialog';
  state.dlg = { id: null, i: 0, chars: 0, choice: null, obj: lines.slice(), line: { w: 'nar', t: lines[0] } };
  lines.forEach(t => pushLog('', t));
}
function nextStep() {
  const d = state.dlg;
  while (state.dlg === d) {
    const steps = S.scenes[d.id];
    d.i++;
    if (d.i >= steps.length) { endScene(); return; }
    const st = steps[d.i];
    if (st.when && !st.when(view())) continue;
    if (st.go) { state.dlg = { id: st.go, i: -1, chars: 0, line: null, choice: null, pick: 0 }; nextStep(); return; }
    if (st.do) { if (doAction(st.do)) return; continue; }
    if (st.c) {
      const opts = st.c.filter(o => !o.when || o.when(view()));
      d.choice = opts; d.pick = 0; d.line = null; d.guard = 0.35; return;
    }
    const txt = typeof st.t === 'function' ? st.t(view()) : st.t;
    d.line = { w: st.w, f: st.f || 'neutral', t: txt, cue: st.cue }; d.chars = 0; d.choice = null;
    pushLog(S.names[st.w] || '', txt);
    return;
  }
}
function endScene() { state.dlg = null; if (state.mode === 'dialog') state.mode = 'field'; }
function pickChoice(o) {
  const t = typeof o.t === 'function' ? o.t(view()) : o.t;
  pushLog(S.names.me, t);
  Story.run(o.fx);
  events.push({ type: 'choice', go: o.go });
  state.dlg = { id: o.go, i: -1, chars: 0, line: null, choice: null, pick: 0 };
  nextStep();
}
// Hành động trong kịch bản; trả true khi nó đổi hẳn chế độ chơi (cảnh dừng ở đây).
function doAction(a) {
  const [k, arg] = a.split(':');
  if (k === 'save') { saveGame(); return false; }
  if (k === 'goal') { state.goal = arg; return false; }
  if (k === 'item') { Story.addItem(arg); return false; }
  if (k === 'flag') { Story.flag(arg); return false; }
  if (k === 'debt') { Story.add('var_linh_tab_debt', tune.linh_fee); return false; }
  if (k === 'join') { if (!state.party.includes(arg)) state.party.push(arg); return false; }
  if (k === 'stage1') { if (state.v.var_identity_revelation_stage < 1) Story.set('var_identity_revelation_stage', 1); return false; }
  if (k === 'sellfox') { Story.removeItem('foxbag'); Story.add('var_lumen_gold', tune.fox_bounty); return false; }
  if (k === 'sellcore') { Story.removeItem('core'); Story.add('var_lumen_gold', tune.crab_core_value); return false; }
  if (k === 'fight') { endScene(); startFight(arg); return true; }
  if (k === 'travel') { endScene(); startTravel(arg); return true; }
  if (k === 'actend') { endScene(); startActEnd(); return true; }
  console.warn('doAction: không hiểu', a);
  return false;
}
function dialogStep(dt) {
  const d = state.dlg;
  if (pressed('KeyL')) { state.modeBack = 'dialog'; state.mode = 'log'; return; }
  if (d.obj) {
    d.chars += tune.text_speed * dt;
    if (advance()) {
      if (d.chars < String(d.line.t).length) d.chars = 1e9;
      else { d.i++; if (d.i >= d.obj.length) { endScene(); return; } d.line = { w: 'nar', t: d.obj[d.i] }; d.chars = 0; }
    }
    return;
  }
  if (d.choice) {
    const n = d.choice.length;
    if (d.guard > 0) { d.guard -= dt; return; }
    if (pressed('ArrowUp') || pressed('KeyW')) { d.pick = (d.pick + n - 1) % n; sfx.blip(); }
    if (pressed('ArrowDown') || pressed('KeyS')) { d.pick = (d.pick + 1) % n; sfx.blip(); }
    const dg = digitPressed(n); if (dg) { pickChoice(d.choice[dg - 1]); return; }
    if (pressed('Enter')) pickChoice(d.choice[d.pick]);
    return;
  }
  if (d.line) {
    const was = Math.floor(d.chars);
    d.chars += tune.text_speed * dt;
    if (Math.floor(d.chars) !== was && d.chars < d.line.t.length && Math.floor(d.chars) % 3 === 0) sfx.blip();
    if (advance()) { if (d.chars < d.line.t.length) d.chars = 1e9; else nextStep(); }
  }
}

// ==== ĐI LẠI ==================================================================================
function mapNow() { return S.maps[state.map]; }
function maxX() { // thực thể có block() đúng thì chặn đường
  const m = mapNow(); let mx = m.w - 60;

}
function near(x) { return Math.abs(state.x - x) < tune.reach; }

    if (e.type === 'puddle') return { label: S.hints.puddle, act: () => checkPuddle() };
    if (e.type === 'pickup') return { label: S.hints[e.id], act: () => { Story.flag(e.id + '_taken'); Story.addItem(e.id); showLines(S.pickups[e.id]); } };
    if (e.type === 'travel') return { label: S.hints.travel, act: () => startTravel(e.to) };
    if (e.type === 'shop') return { label: `${S.hints.shop} · bánh mì ${state.breadPrice} Lumen`, act: () => startScene('bread_shop') };

function checkPuddle() { // Vũng Nước Lưu Game (handover 3.1): đếm, lưu, nói một câu theo trạng thái

function queueLine(t) { state.walkq.push(t); }

function fieldStep(dt) {
  if (pressed('KeyP') || pressed('Escape')) { scene = 'pause'; return; }
  if (pressed('KeyL')) { state.modeBack = 'field'; state.mode = 'log'; return; }
  if (pressed('KeyI')) { openInv(); return; }
  let v = 0;
  if (down.has('ArrowLeft') || down.has('KeyA')) v -= tune.walk_speed;
  if (down.has('ArrowRight') || down.has('KeyD')) v += tune.walk_speed;
  state.moving = !!v && state.x > 60 && state.x < maxX();
  if (v) {

  });
  for (const e of mapNow().entities) { // cảnh tự kích hoạt
    if (e.type === 'auto' && !state.flags[e.once] && (!e.when || e.when(view())) && state.x >= e.x - 60) {

    }

}

// ---- Chuyến tàu lưng cá -------------------------------------------------------------------
function startTravel(to) { state.mode = 'travel'; state.travel = { to, t: 0, half: false }; }
function travelStep(dt) {
  const tr = state.travel; tr.t += dt;

    sfx.chime();
  }
  if (tr.t >= tune.travel_time) { state.mode = 'field'; state.travel = null; saveGame(); }
}

// ---- Túi đồ: mô tả là hàm của trạng thái ---------------------------------------------------
function invList() {
  const ids = Object.keys(state.items).filter(k => state.items[k] > 0 && S.items[k]);

}
function openInv() { state.inv = { pick: 0, msg: null }; state.mode = 'inv'; }
function invStep() {

  iv.pick = clamp(iv.pick, 0, list.length - 1);
  if (pressed('ArrowUp') || pressed('KeyW')) { iv.pick = (iv.pick + list.length - 1) % list.length; iv.msg = null; sfx.blip(); }

      Story.add('var_memoria_coins', -1);
      Story.add('var_architect_corruption', -tune.corrupt_cleanse);
      Story.add('int_clue_fragments_found', 1);
      iv.msg = it.cleanse; sfx.calm();
    } else if (it.use === 'eat') {

// ==== MÀN NÉ ĐÒN ==============================================================================
// Boss đứng ở trên, khung né ở dưới. Linh hồn của cậu là hai nhịp tim xoay quanh nhau (điểm
// trúng ở giữa). Viên đạn sượt qua làm đầy Cộng Hưởng; hết một đợt là Khoảng Lặng để chọn hành
// động; Cộng Hưởng đầy thì hành động kế mạnh gấp đôi. Đây là chỗ game khác Undertale: không có
// menu cố định, mỗi sinh vật có động từ riêng, đạn sượt là tài nguyên, bạn đồng hành báo trước.
function arena() {
  const w = tune.arena_w + (state.party.length ? tune.arena_w_party : 0), h = tune.arena_h;
  return { x: W / 2 - w / 2, y: 400, w, h };
}
function startFight(id) {
  const a = arena();
  state.mode = 'fight';
  state.fight = {
    id, phase: 'msg', t: 0, wave: -1, pattern: null, spawnT: 0, waveT: 0,
    bullets: [], soul: { x: a.x + a.w / 2, y: a.y + a.h * 0.7, hp: tune.soul_hp, inv: 0 },
    res: 0, rage: tune.crab_rage, bossHp: tune.crab_hp, bugs: tune.bug_count,
    warmCount: 0, msgs: [{ t: S.fights[id].intro, d: 1.6 }], pick: 0, quietT: 0, shake: 0, flash: 0, warn: null,
  };
  pushLog('', S.fights[id].intro);
  events.push({ type: 'fight', id });
}
function fmsg(t, d = 1.7) { state.fight.msgs.push({ t, d }); pushLog('', t); }
function wavePatterns(id) {
  if (id === 'crab') return ['sparks', 'slag', 'pillars'];
  if (id === 'scale') return ['burst'];
  return ['spit'];
}
function beginWave() {
  const f = state.fight, pats = wavePatterns(f.id);
  f.wave++; f.pattern = pats[f.wave % pats.length];
  f.phase = 'wave'; f.waveT = 0; f.spawnT = 0.7; // 0.7 giây đầu là lời báo trước của bạn đồng hành
  f.warn = S.fights[f.id].warn[f.pattern];

}
function intensity() { // cua càng giận càng dữ: 0.55 → 1.05
  const f = state.fight;
  return f.id === 'crab' ? 0.55 + 0.5 * clamp(f.rage / tune.crab_rage, 0, 1.2) : 1;
}
function spawn(dt) {
  const f = state.fight, a = arena(), k = intensity();
  f.spawnT -= dt;
  if (f.spawnT > 0) return;
  if (f.pattern === 'sparks') { // tia lửa rũ từ lò trên mai
    f.spawnT = 1 / (tune.crab_spark_rate * k);
    const x = a.x + 10 + rng() * (a.w - 20);
    f.bullets.push({ kind: 'spark', x, y: a.y - 6, vx: (rng() - 0.5) * 40, vy: tune.crab_spark_speed * (0.8 + rng() * 0.4) * k, r: 6, dmg: tune.crab_hit });
  } else if (f.pattern === 'slag') { // xỉ sắt lăn ngang theo ba làn, chừa khe
    f.spawnT = 0.85 / k;
    const lane = Math.floor(rng() * 3), y = a.y + a.h * (0.25 + lane * 0.27), fromL = rng() < 0.5;
    f.bullets.push({ kind: 'slag', x: fromL ? a.x - 10 : a.x + a.w + 10, y, vx: (fromL ? 1 : -1) * tune.crab_slag_speed * k, vy: 0, r: 13, rot: 0, dmg: tune.crab_hit });
  } else if (f.pattern === 'pillars') { // cột lửa: báo trước rồi mới phụt
    f.spawnT = 1.15 / k;
    const x = a.x + 30 + rng() * (a.w - 60);
    f.bullets.push({ kind: 'pillar', x, y: a.y, w: 46, warn: tune.crab_pillar_warn, life: 0.55, r: 0, dmg: tune.crab_hit });
  } else if (f.pattern === 'burst') { // mảnh kính cân bay tứ phía từ trên xuống
    f.spawnT = 1 / tune.scale_shard_rate;
    const ang = Math.PI * (0.15 + rng() * 0.7), sp = tune.scale_shard_speed * (0.8 + rng() * 0.4);
    f.bullets.push({ kind: 'shard', x: a.x + a.w / 2 + (rng() - 0.5) * 80, y: a.y - 4, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, r: 6, rot: rng() * 6, dmg: 2 });
  } else if (f.pattern === 'spit') { // Bọ Ký Sinh phun nhắm theo chỗ cậu đứng
    f.spawnT = 1 / (tune.bug_spit_rate * Math.max(1, f.bugs) / 2);
    const i = Math.floor(rng() * f.bugs), bx = bugX(i, f.bugs), by = a.y - 8;
    const dx = f.soul.x - bx, dy = f.soul.y - by, l = Math.hypot(dx, dy) || 1;
    f.bullets.push({ kind: 'spit', x: bx, y: by, vx: dx / l * tune.bug_spit_speed, vy: dy / l * tune.bug_spit_speed, r: 6, dmg: 2 });

}
function bugX(i, n) { const a = arena(); return a.x + a.w * (i + 1) / (n + 1); }
function fightStep(dt) {
  const f = state.fight, a = arena(), so = f.soul;
  f.t += dt; f.shake = Math.max(0, f.shake - dt); f.flash = Math.max(0, f.flash - dt);
  // Linh hồn luôn di chuyển được, kể cả lúc có chữ: né là việc của tay, đọc là việc của mắt
  let vx = 0, vy = 0;
  if (down.has('ArrowLeft') || down.has('KeyA')) vx--;
  if (down.has('ArrowRight') || down.has('KeyD')) vx++;
  if (down.has('ArrowUp') || down.has('KeyW')) vy--;
  if (down.has('ArrowDown') || down.has('KeyS')) vy++;
  const sp = tune.soul_speed * (down.has('ShiftLeft') || down.has('ShiftRight') ? tune.soul_slow : 1);
  const l = Math.hypot(vx, vy) || 1;
  if (f.phase !== 'quiet') { so.x = clamp(so.x + vx / l * sp * dt, a.x + 10, a.x + a.w - 10); so.y = clamp(so.y + vy / l * sp * dt, a.y + 10, a.y + a.h - 10); }
  so.inv = Math.max(0, so.inv - dt);
  // đạn
  for (const b of f.bullets) {
    if (b.kind === 'pillar') {
      if (b.warn > 0) { b.warn -= dt; continue; }
      b.life -= dt;
      if (Math.abs(so.x - b.x) < b.w / 2 && so.inv <= 0) hurt(b.dmg);
      continue;
    }
    b.x += b.vx * dt; b.y += b.vy * dt; if (b.rot !== undefined) b.rot += dt * 6;
    const d = Math.hypot(so.x - b.x, so.y - b.y);
    if (d < b.r + tune.soul_hit_r) { if (so.inv <= 0) { hurt(b.dmg); b.dead = true; } }
    else if (d < tune.graze_r && !b.grazed) { b.grazed = true; f.res = Math.min(tune.resonance_max, f.res + tune.graze_gain); sfx.graze(); }
  }
  f.bullets = f.bullets.filter(b => !b.dead && (b.kind === 'pillar' ? b.life > 0 : b.x > a.x - 40 && b.x < a.x + a.w + 40 && b.y < a.y + a.h + 30 && b.y > a.y - 60));
  // chữ
  if (f.msgs.length) {
    f.msgs[0].d -= dt;
    if (advance() && f.phase !== 'quiet') f.msgs[0].d = Math.min(f.msgs[0].d, 0.05);
    if (f.msgs[0].d <= 0) f.msgs.shift();

  }

  if (f.phase === 'msg') { beginWave(); return; }
  if (f.phase === 'wave') {
    f.waveT += dt;
    const len = f.id === 'scale' ? tune.scale_time : tune.wave_time;
    if (f.waveT < len - 0.8) spawn(dt);
    if (f.waveT >= len && (f.bullets.length === 0 || f.waveT >= len + 1.5)) {
      f.bullets = []; f.warn = null;
      if (f.id === 'scale') { fmsg(S.fights.scale.end, 2); f.result = 'survived'; f.phase = 'end'; return; }
      f.phase = 'quiet'; f.quietT = tune.quiet_time; f.pick = 0;

  }

}
function hurt(dmg) {
  const f = state.fight;
  f.soul.hp -= dmg; f.soul.inv = tune.invuln_time; f.shake = 0.3; sfx.hurt();
  events.push({ type: 'hurt', hp: f.soul.hp });
  if (f.soul.hp <= 0) {
    f.soul.hp = 0; f.bullets = []; f.warn = null;
    if (f.id === 'scale') { fmsg(S.fights.scale.down, 2); f.result = 'survived'; f.phase = 'end'; return; } // không thể thua: Kaelen che
    fmsg(S.fights[f.id].lines.down, 2.2); f.phase = 'down';
  }
}
function restartFight() { const id = state.fight.id; startFight(id); state.fight.msgs = []; } // thử lại từ đầu trận, không mất gì
function fightActions() {
  const f = state.fight;
  return S.fights[f.id].actions.filter(x => !x.needs || Story.has(x.needs));
}
function quietStep(dt) {
  const f = state.fight, acts = fightActions();
  f.quietT -= dt;
  if (pressed('ArrowUp')) { f.pick = (f.pick + acts.length - 1) % acts.length; sfx.blip(); }
  if (pressed('ArrowDown')) { f.pick = (f.pick + 1) % acts.length; sfx.blip(); }
  const dg = digitPressed(acts.length);
  let choice = dg ? acts[dg - 1] : (pressed('Enter') || pressed('KeyE')) ? acts[f.pick] : null;
  if (!choice && f.quietT <= 0) choice = { id: 'wait' };
  if (choice) doFightAction(choice.id);
}
function doFightAction(id) {
  const f = state.fight, L = S.fights[f.id].lines, full = f.res >= tune.resonance_max;
  const m = full ? tune.resonance_mult : 1;
  f.msgs = [];
  if (full && id !== 'wait' && id !== 'soup') { fmsg(L.resonance, 1.4); f.res = 0; sfx.chime(); }
  events.push({ type: 'act', id, rage: f.rage });
  if (id === 'wait') fmsg(L.wait);
  else if (id === 'soup') { Story.removeItem('soup'); f.soul.hp = tune.soul_hp; fmsg(L.soup); }
  else if (id === 'whisper') { f.rage -= tune.act_whisper * m; fmsg(L.whisper); sfx.calm(); }
  else if (id === 'warm') {
    f.warmCount++;
    f.rage -= tune.act_warm * (f.warmCount >= 2 ? 2 : 1) * m;
    if (f.warmCount >= 2) { Story.flag('crab_warmed'); fmsg(L.warm2, 2); } else fmsg(L.warm, 2);
    sfx.calm();
  } else if (id === 'pull') {
    if (f.rage <= tune.crab_rage_calm) { f.result = 'spared'; f.phase = 'end'; return; }
    f.rage += 5; fmsg(L.pullNo, 2); sfx.hurt();
  } else if (id === 'strike') {
    f.bossHp -= tune.act_strike * m; f.rage += tune.act_strike_rage; f.flash = 0.3; Story.flag('crab_struck');
    fmsg(L.strike, 1.8); sfx.strike();
    if (f.bossHp <= 0) { f.bossHp = 0; f.result = 'killed'; f.phase = 'end'; return; }
  } else if (id === 'pick') {
    f.bugs--; fmsg(L.pick, 1.8); sfx.calm();
    if (f.bugs <= 0) { f.result = 'cleared'; f.phase = 'end'; return; }
  }

}
function endFight() {
  const f = state.fight; state.fight = null; state.mode = 'field';
  events.push({ type: 'fightEnd', id: f.id, result: f.result });
  if (f.id === 'crab') {
    Story.flag('crab_done');
    if (f.result === 'spared') { Story.flag('crab_spared'); Story.add('var_bond_linh', 10); Story.add('var_eco_balance', tune.eco_feed); startScene('crab_spared'); } // guessed: Linh quý người tha con cua
    else { // handover: giết sinh vật hiền lành
      Story.flag('crab_killed'); Story.add('var_eco_balance', -tune.eco_kill); Story.add('var_architect_corruption', tune.corrupt_kill);
      Story.addItem('core'); startScene('crab_killed');
    }
  } else if (f.id === 'scale') { Story.flag('flag_scale_exploded'); startScene('scale_after'); }
  else if (f.id === 'bug') { Story.flag('bugs_cleared'); Story.add('var_eco_balance', tune.eco_feed); startScene('bug_after'); }
}

// ---- Hết Hồi 1 ----------------------------------------------------------------------------------
function startActEnd() { state.endT = 0; state.gained = S.actEnd.title; scene = 'results'; events.push({ type: 'actEnd' }); }
function actEndLines() { return S.actEnd.lines.map(f => f(view())).filter(Boolean); }

// ==== VẼ ==========================================================================================
function camX() { return clamp(state.x - W / 2, 0, mapNow().w - W); }
function beat(t) { // Lõi Nhịp Tim: "thịch–thịch" theo heartbeat_bpm
  const p = (t * tune.heartbeat_bpm / 60) % 1;
  return Math.max(Math.exp(-p * 18), 0.6 * Math.exp(-Math.max(0, p - 0.22) * 18) * (p > 0.22 ? 1 : 0));
}
// ---- Bầu trời tinh cầu rỗng ----
function drawSky(cam, kind) {
  const cold = state.cold;
  const top = kind === 'chonoi' ? [22, 30, 52] : [30, 22, 34], bot = kind === 'chonoi' ? [104, 140, 150] : [196, 128, 84];
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, mix(top, [24, 28, 40], cold * 0.6)); g.addColorStop(1, mix(bot, [96, 104, 120], cold * 0.6));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // lục địa mọc ngược trên vỏ trong của tinh cầu
  ctx.fillStyle = kind === 'chonoi' ? 'rgba(60,78,96,0.75)' : 'rgba(84,58,58,0.7)';
  for (let i = 0; i < 6; i++) {
    const cx = ((i * 430 - cam * 0.06) % (W + 400) + W + 400) % (W + 400) - 200, w = 180 + (i * 53) % 120;
    ctx.beginPath(); ctx.moveTo(cx - w / 2, 0);
    for (let k = 0; k <= 8; k++) ctx.lineTo(cx - w / 2 + w * k / 8, 22 + ((i * 7 + k * 13) % 5) * 9 + Math.sin(k + i) * 6);
    ctx.lineTo(cx + w / 2, 0); ctx.closePath(); ctx.fill();
    glow('#bfe8a0', 6); ctx.fillStyle = 'rgba(190,232,160,0.7)'; // rừng phát quang treo ngược
    for (let k = 1; k < 7; k++) ctx.fillRect(cx - w / 2 + w * k / 7, 30 + ((k * 11 + i) % 4) * 6, 2, 2);
    noglow(); ctx.fillStyle = kind === 'chonoi' ? 'rgba(60,78,96,0.75)' : 'rgba(84,58,58,0.7)';
  }
  // đất uốn cong lên ở hai chân trời
  ctx.strokeStyle = kind === 'chonoi' ? 'rgba(80,110,120,0.5)' : 'rgba(120,80,60,0.5)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(W / 2, H + 900, W * 1.1, 1250, 0, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
  // Lõi Nhịp Tim
  const b = beat(state.t), cx = W / 2 - cam * 0.02, cy = 150, r = 40 * (1 + 0.07 * b);
  const rg = ctx.createRadialGradient(cx, cy, 2, cx, cy, r * 3.2);
  rg.addColorStop(0, `rgba(255,236,190,${0.95})`); rg.addColorStop(0.3, `rgba(255,170,110,${0.55 + 0.2 * b})`); rg.addColorStop(1, 'rgba(255,140,90,0)');
  ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(cx, cy, r * 3.2, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(180,70,60,0.55)'; ctx.lineWidth = 2; // gân
  for (let i = 0; i < 5; i++) {
    const a0 = i * 1.25 + 0.3; ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a0) * r * 0.3, cy + Math.sin(a0) * r * 0.3);
    ctx.quadraticCurveTo(cx + Math.cos(a0 + 0.5) * r * 0.9, cy + Math.sin(a0 + 0.5) * r * 0.9, cx + Math.cos(a0 + 0.2) * r * 1.05, cy + Math.sin(a0 + 0.2) * r * 1.05);
    ctx.stroke();
  }
  ctx.strokeStyle = `rgba(255,200,150,${0.35 * b})`; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, r * (1.4 + (1 - b) * 0.8), 0, Math.PI * 2); ctx.stroke();
}
// ---- Thung Lũng Phế Liệu ----
function drawPhelieu(cam) {

function drawEntities(cam) {
  const m = mapNow(), gy = m.ground, vw = view();
  for (const e of m.entities) {
    const x = e.x - cam; if (x < -260 || x > W + 260) continue;
    if (e.when && !e.when(vw) && e.type !== 'boss') continue;
    if (e.type === 'puddle') drawPuddle(x, gy + 10);
    else if (e.id === 'cocoon') drawCocoon(x, gy);
    else if (e.id === 'campfire') drawCampfire(x, gy, state.map === 'phelieu');
    else if (e.type === 'creature' && e.id === 'echofox') drawEchoFox(x, gy, 1.1, -1, state.t);
    else if (e.type === 'pickup') drawEgg(x, gy - 8, 1, state.t);
    else if (e.type === 'boss') drawCrab(x, gy, 1, state.t, { calm: state.flags.crab_spared, dead: state.flags.crab_killed, half: state.flags.crab_warmed, linh: !state.flags.crab_done });
    else if (e.id === 'scale') drawScale(x, gy, 1, state.t, state.flags.flag_scale_exploded);
    else if (e.type === 'shop') drawBreadStall(x, gy);
    else if (e.type === 'npc' && e.id === 'vex') drawVex(x, gy, 1, -1, state.t);
    else if (e.type === 'optfight') { for (let i = 0; i < 3; i++) drawBug(x - 30 + i * 30, gy + 6, 0.8, state.t + i); }
    else if (e.type === 'travel') drawWhaleSign(x, gy);
  }
}

  ctx.fillStyle = full ? '#ffd890' : '#c8a0e8'; ctx.fillRect(a.x + a.w - 160, by - 6, 160 * f.res / tune.resonance_max, 12); noglow();
  // thanh của boss
  if (f.id === 'crab') {
    text(`${S.fights.crab.title}`, W - 60, 120, 18, '#f4ead4', 'right');
    text(S.ui.rage, W - 250, 150, 14, '#e8a080', 'right'); ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(W - 240, 144, 180, 10);
    ctx.fillStyle = '#e8805a'; ctx.fillRect(W - 240, 144, 180 * clamp(f.rage / tune.crab_rage, 0, 1), 10);
    ctx.fillStyle = 'rgba(160,220,160,0.8)'; ctx.fillRect(W - 240 + 180 * tune.crab_rage_calm / tune.crab_rage, 140, 2, 18); // vạch "đủ dịu để gỡ"
    if (state.flags.crab_struck) { text(S.ui.hpBoss, W - 250, 172, 14, '#d8ccb4', 'right'); ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(W - 240, 166, 180, 10); ctx.fillStyle = '#c86060'; ctx.fillRect(W - 240, 166, 180 * f.bossHp / tune.crab_hp, 10); }
  } else if (f.id === 'bug') text(S.ui.left(f.bugs), W - 60, 120, 18, '#f4ead4', 'right');
  else if (f.phase === 'wave') text(S.ui.survive(Math.max(0, Math.ceil(tune.scale_time - f.waveT))), W - 60, 120, 18, '#f4ead4', 'right');
  // lời báo trước của bạn đồng hành
  if (f.warn && f.phase === 'wave' && f.waveT < 2.2) { ctx.save(); ctx.globalAlpha = Math.min(1, (2.2 - f.waveT) * 2); text(f.warn, W / 2, a.y - 18, 17, '#a8e0f0', 'center', 'italic '); ctx.restore(); }
  // chữ
  if (f.msgs.length && f.msgs[0].t) { const m = f.msgs[0]; ctx.font = `18px ${FONT}`; const tw = Math.min(W - 80, ctx.measureText(m.t).width); panel(W / 2 - tw / 2 - 20, 40, tw + 40, 40, 0.88); text(m.t, W / 2, 60, 18, '#f4ead4'); }
  if (f.phase === 'quiet') drawQuiet(f, a);
}
function drawBullet(b, a) {
  if (b.kind === 'spark') { glow('#ffa040', 10); ctx.fillStyle = '#ffb860'; ctx.beginPath(); ctx.moveTo(b.x, b.y - 9); ctx.quadraticCurveTo(b.x + 6, b.y, b.x, b.y + 5); ctx.quadraticCurveTo(b.x - 6, b.y, b.x, b.y - 9); ctx.fill(); noglow(); }
  else if (b.kind === 'slag') { ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.x * 0.05); glow('#ff7030', 8); ctx.fillStyle = '#8a4a30'; ctx.beginPath(); for (let i = 0; i < 7; i++) { const ang = i * Math.PI * 2 / 7, rr = b.r * (0.8 + ((i * 37) % 5) / 12); ctx.lineTo(Math.cos(ang) * rr, Math.sin(ang) * rr); } ctx.closePath(); ctx.fill(); ctx.fillStyle = '#ff9050'; ctx.fillRect(-3, -3, 5, 4); noglow(); ctx.restore(); }
  else if (b.kind === 'pillar') {
    if (b.warn > 0) { ctx.fillStyle = `rgba(255,90,60,${0.15 + 0.15 * Math.sin(state.t * 30)})`; ctx.fillRect(b.x - b.w / 2, a.y, b.w, a.h); }
    else { glow('#ff7030', 20); const g = ctx.createLinearGradient(b.x - b.w / 2, 0, b.x + b.w / 2, 0); g.addColorStop(0, 'rgba(255,120,40,0.2)'); g.addColorStop(0.5, 'rgba(255,220,140,0.95)'); g.addColorStop(1, 'rgba(255,120,40,0.2)'); ctx.fillStyle = g; ctx.fillRect(b.x - b.w / 2, a.y, b.w, a.h); noglow(); }
  } else if (b.kind === 'shard') { ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot); glow('#c8f0ff', 8); ctx.fillStyle = '#d8f4ff'; ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(5, 5); ctx.lineTo(-4, 4); ctx.closePath(); ctx.fill(); noglow(); ctx.restore(); }
  else if (b.kind === 'spit') { glow('#b0e060', 8); ctx.fillStyle = '#c0f070'; ctx.beginPath(); const ang = Math.atan2(b.vy, b.vx); ctx.ellipse(b.x, b.y, 8, 5, ang, 0, Math.PI * 2); ctx.fill(); noglow(); }
}
function drawSoul(so) { // hai nhịp tim xoay quanh nhau; điểm trúng ở giữa
  if (so.inv > 0 && Math.floor(state.t * 20) % 2) return;
  const a = state.t * 6, d = 6;
  for (let i = 0; i < 2; i++) {
    const px = so.x + Math.cos(a + i * Math.PI) * d, py = so.y + Math.sin(a + i * Math.PI) * d * 0.6;
    glow(i ? '#ffb070' : '#fff0c8', 12); ctx.fillStyle = i ? '#ffb070' : '#fff0c8';
    ctx.beginPath(); ctx.moveTo(px, py - 5); ctx.lineTo(px + 4, py); ctx.lineTo(px, py + 5); ctx.lineTo(px - 4, py); ctx.closePath(); ctx.fill();
  }
  noglow();
  ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fillRect(so.x - 1, so.y - 1, 2, 2);
}
function drawQuiet(f, a) {
  const acts = fightActions();
  panel(a.x, a.y + 6, a.w, a.h - 12, 0.95);
  text(S.ui.quietTitle, a.x + 20, a.y + 28, 16, '#f0c76a', 'left');
  ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(a.x + a.w - 140, a.y + 23, 120, 6);
  ctx.fillStyle = '#c8a0e8'; ctx.fillRect(a.x + a.w - 140, a.y + 23, 120 * clamp(f.quietT / tune.quiet_time, 0, 1), 6);
  const q = S.fights[f.id].quiet(f);
  text(q, a.x + 20, a.y + 52, 15, '#d8ccb4', 'left', 'italic ');
  acts.forEach((x, i) => {
    const y = a.y + 82 + i * 26, sel = i === f.pick;
    const locked = x.id === 'pull' && f.rage > tune.crab_rage_calm;
    text(`${i + 1}. ${x.label}`, a.x + 30, y, 17, sel ? '#f0c76a' : locked ? '#8a8070' : '#ece2cc', 'left');
    text(x.hint, a.x + 230, y, 14, '#9a9280', 'left', 'italic ');
  });
}

// ---- Scenes ---------------------------------------------------------------------------------
const scenes = {
  figures: { // mọi nhân vật, sinh vật và boss, mỗi hình một dáng, tên bên dưới
    update(dt) { state.t += dt; },
    draw() {
      clear('#16141c'); const t = state.t, r1 = 250;
      const row = [['Kẻ Trắng Tay', x => drawHero(x, r1, 1.3, 1, t)], ['Linh & Mốc', x => drawLinh(x, r1, 1.3, 1, t)], ['Kaelen', x => drawKael(x, r1, 1.2, 1, t)], ['Mira', x => drawMira(x, r1, 1.2, 1, t)], ['Vex', x => drawVex(x, r1, 1.1, 1, t)], ['Hồ Ly Âm Bản', x => drawEchoFox(x, r1, 1.8, 1, t)]];
      row.forEach(([n, fn], i) => { const x = 110 + i * 210; fn(x); text(n, x, r1 + 30, 16, '#ece2cc'); });
      const r2 = 600;
      drawCrab(230, r2, 1, t, { linh: false }); text(S.names.crab, 230, r2 + 30, 16, '#ece2cc');
      drawScale(560, r2, 0.9, t, false); text(S.names.scale, 560, r2 + 30, 16, '#ece2cc');
      for (let i = 0; i < 3; i++) drawBug(760 + i * 56, r2, 1.6, t + i); text(S.names.bug, 815, r2 + 30, 16, '#ece2cc');
      drawWhale(1110, r2 - 10, 0.42, t); text(S.names.whale, 1110, r2 + 30, 16, '#ece2cc');
    },
  },
  title: {
    update(dt) {
      state.t += dt;
      if (pressed('Enter') || pressed('Space')) { reset(); scene = 'play'; startScene('wake'); }
      if (pressed('KeyC') && load('trong2_save')) { if (loadGame()) scene = 'play'; }
    },
    draw() {
      drawSky(0, 'phelieu');
      ctx.fillStyle = 'rgba(10,8,14,0.45)'; ctx.fillRect(0, 0, W, H);
      text(TITLE, W / 2, H / 2 - 40, 68, '#f8eedc');
      text(S.ui.sub, W / 2, H / 2 + 14, 20, '#e0d4bc', 'center', 'italic ');
      CONTROLS.forEach((c, i) => text(c, W / 2, H / 2 + 80 + i * 28, 17, '#cfc4ac'));
      text(S.ui.start, W / 2, H - 70, 24, '#f8eedc');
      if (load('trong2_save')) text(S.ui.cont, W / 2, H - 38, 17, '#a8d8a0');
    },
  },
  play: {
    update(dt) {
      state.t += dt; state.score = state.v.var_lumen_gold;
      state.cold += (state.coldTarget - state.cold) * Math.min(1, dt);
      if (state.doublePulse) { const p = (state.t * tune.heartbeat_bpm / 60) % 1, pp = ((state.t - dt) * tune.heartbeat_bpm / 60) % 1; if (p < pp && state.mode === 'field') sfx.beat(); }
      walklineStep(dt);
      if (state.mode !== 'field') state.moving = false;
      if (state.mode === 'field') fieldStep(dt);
      else if (state.mode === 'dialog') dialogStep(dt);
      else if (state.mode === 'fight') fightStep(dt);
      else if (state.mode === 'travel') travelStep(dt);
      else if (state.mode === 'inv') invStep();
      else if (state.mode === 'log') logStep();
    },
    draw() {
      if (state.mode === 'fight') { drawFight(); return; }
      if (state.mode === 'travel') { drawTravel(); return; }
      if (state.mode === 'inv') { drawInv(); return; }
      if (state.mode === 'log') { drawLog(); return; }
      drawWorld(); drawWalkline(); drawHUD();
      if (state.mode === 'dialog') drawDialog();
    },
  },
  pause: {
    update() {
      if (pressed('KeyP') || pressed('Escape')) scene = 'play';
      if (pressed('ArrowLeft')) { CONFIG.text_speed.value = Math.max(CONFIG.text_speed.min, CONFIG.text_speed.value - 6); store('trong2_speed', CONFIG.text_speed.value); sfx.blip(); }
      if (pressed('ArrowRight')) { CONFIG.text_speed.value = Math.min(CONFIG.text_speed.max, CONFIG.text_speed.value + 6); store('trong2_speed', CONFIG.text_speed.value); sfx.blip(); }
    },
    draw() {
      scenes.play.draw(); ctx.fillStyle = 'rgba(8,6,12,0.72)'; ctx.fillRect(0, 0, W, H);
      text(S.ui.paused, W / 2, H / 2 - 60, 46, '#f4ead4');
      text(`${S.ui.speed}: ${CONFIG.text_speed.value} chữ/giây`, W / 2, H / 2 + 10, 20, '#ece2cc');
      text(S.ui.speedHint, W / 2, H / 2 + 42, 16, '#b8b0a0');
      text(S.ui.resume, W / 2, H / 2 + 96, 18, '#d8ccb4');
    },
  },
  results: { // Hết Hồi 1
    update(dt) {
      state.t += dt; state.endT += dt;
      if (pressed('Enter') && state.endT > 2) { reset(); scene = 'play'; startScene('wake'); }
    },
    draw() {
      drawSky(0, 'chonoi'); ctx.fillStyle = 'rgba(8,6,12,0.78)'; ctx.fillRect(0, 0, W, H);
      text(S.actEnd.title, W / 2, 110, 34, '#f0c76a');
      const ls = actEndLines(), n = Math.floor(state.endT / 1.3);
      ls.slice(0, n + 1).forEach((l, i) => { ctx.save(); ctx.globalAlpha = i < n ? 1 : (state.endT % 1.3) / 1.3; text(l, W / 2, 190 + i * 44, 19, '#ece2cc', 'center', 'italic '); ctx.restore(); });
      text(S.actEnd.next, W / 2, H - 100, 17, '#b8b0a0');
      if (state.endT > 2) text(S.ui.again, W / 2, H - 58, 19, '#f4ead4');
    },
  },
};

// ---- Loop -----------------------------------------------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop) ---------------------------
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
if (params.get('map')) { scene = 'play'; state.map = params.get('map'); state.x = Number(params.get('x')) || 600; state.party = ['linh', 'kael', 'mira']; state.flags.flag_scale_exploded = true; } // ?map=chonoi&x=900: xem một vùng (chỉ để thử)
if (params.get('fight')) { scene = 'play'; if (params.get('fight') === 'bug') state.party = ['linh', 'kael', 'mira']; startFight(params.get('fight')); } // ?fight=crab: vào thẳng màn né để thử
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
